<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uyumsoft | Bütçe Tahminleme Sistemi</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        :root {
            --uyum-red: #E30613;
            --uyum-red-hover: #b5050f;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #212529;
            --text-muted: #6C757D;
            --border-color: #E9ECEF;
            --border-radius: 12px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem 0; /* Kaydırmayı önlemek için dikey boşluk azaltıldı */
            font-size: 1.05rem; /* Genel font boyutu çok az büyütüldü */
            overflow-x: hidden;
        }

        /* Daha geniş kullanım alanı için genişletilmiş konteyner */
        .dashboard-container {
            width: 100%;
            max-width: 1100px;
            padding: 0 15px;
            margin: 0 auto;
        }

        /* Logo Sola Alındı */
        .header-container {
            text-align: left;
            margin-bottom: 1.2rem;
            padding-left: 0.5rem;
        }

            .header-container img {
                max-width: 180px;
                height: auto;
            }

        .glass-card {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            padding: 2rem; /* Yükseklik kazanmak için iç boşluk hafif kısıldı */
            transition: all 0.3s ease;
        }

        @media (min-width: 768px) {
            .border-start-md {
                border-left: 1px solid var(--border-color);
            }
        }

        .form-label {
            font-weight: 500;
            color: var(--text-main);
            font-size: 1rem; /* Büyütüldü */
            margin-bottom: 0.4rem;
        }

        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #CED4DA;
            padding: 0.65rem 1rem;
            font-size: 1rem; /* Büyütüldü */
            transition: border-color 0.2s, box-shadow 0.2s;
        }

            .form-control:focus, .form-select:focus {
                border-color: var(--uyum-red);
                box-shadow: 0 0 0 0.25rem rgba(227, 6, 19, 0.15);
            }

        /* Custom Range & Number Inputs */
        .range-wrapper {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .form-range {
            flex-grow: 1;
            height: 1.5rem;
        }

            /* Kaydırma Çubuğu Arka Planı (Görünmezlik Hatası Giderildi) */
            .form-range::-webkit-slider-runnable-track {
                background-color: #ced4da;
                height: 6px;
                border-radius: 3px;
            }

            .form-range::-moz-range-track {
                background-color: #ced4da;
                height: 6px;
                border-radius: 3px;
            }

            /* Kaydırma Çubuğu Topuzu */
            .form-range::-webkit-slider-thumb {
                background: var(--uyum-red);
                margin-top: -5px; /* Çizgiye ortalamak için */
            }

                .form-range::-webkit-slider-thumb:active {
                    background-color: var(--uyum-red-hover);
                }

            .form-range::-moz-range-thumb {
                background-color: var(--uyum-red);
            }

        /* % Sembolünün alt satıra inmemesi için sabit genişlik ve flex-nowrap */
        .input-group.flex-nowrap {
            width: 110px;
            flex-shrink: 0;
        }

        .range-number-input {
            text-align: center;
            font-weight: 600;
            color: var(--uyum-red);
            background-color: #f8f9fa;
            padding-left: 0.2rem;
            padding-right: 0.2rem;
        }

            .range-number-input::-webkit-outer-spin-button,
            .range-number-input::-webkit-inner-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }

            .range-number-input[type=number] {
                -moz-appearance: textfield;
            }

        .btn-primary {
            background-color: var(--uyum-red);
            border-color: var(--uyum-red);
            padding: 0.8rem 1.5rem;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s ease;
        }

            .btn-primary:hover, .btn-primary:focus {
                background-color: var(--uyum-red-hover);
                border-color: var(--uyum-red-hover);
                transform: translateY(-1px);
                box-shadow: 0 4px 12px rgba(227, 6, 19, 0.2);
            }

        /* Result Section */
        #waitingState {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-align: center;
            opacity: 0.6;
        }

        #resultSection {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
            text-align: center;
        }

        .stat-box {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 1.2rem;
            text-align: center;
            height: 100%;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            display: block;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
        }

            .stat-value.highlight {
                color: var(--uyum-red);
            }

        .result-explanation {
            background-color: rgba(227, 6, 19, 0.05);
            border-left: 4px solid var(--uyum-red);
            padding: 1rem;
            border-radius: 4px;
            font-size: 0.95rem;
            color: #495057;
            margin-top: 1.2rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">

        <!-- Header / Logo (Sola Hizalı) -->
        <div class="header-container">
            <img src="Uyumsoft-Transparan-Logo.png" alt="Uyumsoft Logo" onerror="this.src='https://via.placeholder.com/180x50?text=Uyumsoft+Logo'">
        </div>

        <!-- Main Card -->
        <main class="glass-card">
            <div class="row">

                <!-- SOL KOLON: Form Alanı -->
                <div class="col-md-6 pe-md-4 mb-3 mb-md-0">
                    <form id="predictionForm">

                        <!-- Dikey alanı korumak için yan yana düzen -->
                        <div class="row mb-3">
                            <div class="col-sm-7 mb-3 mb-sm-0">
                                <label for="departmentSelect" class="form-label">Departman</label>
                                <select class="form-select" id="departmentSelect" required>
                                    <option value="" selected disabled>Departman Seçiniz...</option>
                                    <option value="1">Operasyon / Üretim</option>
                                    <option value="2">Satış & Pazarlama</option>
                                    <option value="3">İnsan Kaynakları</option>
                                    <option value="4">Finans & Muhasebe</option>
                                    <option value="5">Bilgi Teknolojileri (IT)</option>
                                    <option value="6">Ar-Ge</option>
                                    <option value="7">Genel Yönetim (G&A)</option>
                                    <option value="8">Lojistik / Tedarik Zinciri</option>
                                </select>
                            </div>
                            <div class="col-sm-5">
                                <label for="yearSelect" class="form-label">Tahmin Yılı</label>
                                <select class="form-select" id="yearSelect" required>
                                    <option value="2026" selected>2026</option>
                                    <option value="2027">2027</option>
                                </select>
                            </div>
                        </div>

                        <hr class="mb-3" style="opacity: 0.1;">

                        <h6 class="mb-3" style="font-weight: 600; color: var(--text-main);">Ekonomik Senaryo Beklentileri</h6>

                        <!-- Inflation Input -->
                        <div class="mb-3">
                            <label class="form-label">Beklenen Enflasyon (%)</label>
                            <div class="range-wrapper">
                                <input type="range" class="form-range" id="inflationRange" min="0" max="100" step="0.1" value="45.5">
                                <!-- flex-nowrap ile yan yana zorlama -->
                                <div class="input-group flex-nowrap">
                                    <input type="number" class="form-control range-number-input" id="inflationInput" value="45.5" step="0.1">
                                    <span class="input-group-text px-2">%</span>
                                </div>
                            </div>
                        </div>

                        <!-- USD Input -->
                        <div class="mb-3">
                            <label class="form-label">Beklenen Dolar Artışı (%)</label>
                            <div class="range-wrapper">
                                <input type="range" class="form-range" id="usdRange" min="0" max="100" step="0.1" value="32.5">
                                <div class="input-group flex-nowrap">
                                    <input type="number" class="form-control range-number-input" id="usdInput" value="32.5" step="0.1">
                                    <span class="input-group-text px-2">%</span>
                                </div>
                            </div>
                        </div>

                        <!-- Gold Input -->
                        <div class="mb-4">
                            <label class="form-label">Beklenen Altın Artışı (%)</label>
                            <div class="range-wrapper">
                                <input type="range" class="form-range" id="goldRange" min="0" max="150" step="0.1" value="40.0">
                                <div class="input-group flex-nowrap">
                                    <input type="number" class="form-control range-number-input" id="goldInput" value="40.0" step="0.1">
                                    <span class="input-group-text px-2">%</span>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span id="btnText">Simülasyonu Başlat</span>
                            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>
                    </form>
                </div>

                <!-- SAĞ KOLON: Sonuç Alanı -->
                <div class="col-md-6 ps-md-4 border-start-md">

                    <!-- Başlangıçtaki Bekleme Durumu -->
                    <div id="waitingState">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-bar-chart-line mb-3" viewBox="0 0 16 16" style="opacity:0.3;">
                            <path d="M11 2a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12h.5a.5.5 0 0 1 0 1H.5a.5.5 0 0 1 0-1H1v-3a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3h1V7a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7h1V2zm1 12h2V2h-2v12zm-3 0V7H7v7h2zm-5 0v-3H2v3h2z" />
                        </svg>
                        <p class="mb-0">Simülasyon sonuçlarını görmek için<br>sol taraftan parametreleri belirleyin.</p>
                    </div>

                    <!-- API'den Dönen Sonuçlar -->
                    <section id="resultSection">
                        <h5 class="result-title" id="resDepartment">Departman - Yıl</h5>

                        <div class="row g-3">
                            <div class="col-6">
                                <div class="stat-box">
                                    <span class="stat-label">Önceki Yıl Harcaması</span>
                                    <span class="stat-value" id="resPrevious">₺0</span>
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="stat-box">
                                    <span class="stat-label">Değişim Oranı</span>
                                    <span class="stat-value" id="resChange">%0</span>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="stat-box" style="border-color: rgba(227,6,19,0.3); background-color: #fff;">
                                    <span class="stat-label">Tahmini Bütçe İhtiyacı</span>
                                    <span class="stat-value highlight" id="resPredicted">₺0</span>
                                </div>
                            </div>
                        </div>

                        <div class="result-explanation" id="resExplanation">
                            Açıklama alanı.
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Input ve Slider Senkronizasyonu
        function syncInputs(sliderId, inputId) {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);

            slider.addEventListener('input', () => {
                input.value = slider.value;
            });

            input.addEventListener('input', () => {
                let val = parseFloat(input.value);
                if (!isNaN(val)) {
                    if (val > parseFloat(slider.max)) val = slider.max;
                    if (val < parseFloat(slider.min)) val = slider.min;
                    slider.value = val;
                }
            });
        }

        syncInputs('inflationRange', 'inflationInput');
        syncInputs('usdRange', 'usdInput');
        syncInputs('goldRange', 'goldInput');

        const formatter = new Intl.NumberFormat('tr-TR', {
            style: 'currency',
            currency: 'TRY',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        });

        document.getElementById('predictionForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const btn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            const waitingState = document.getElementById('waitingState');
            const resultSection = document.getElementById('resultSection');

            btn.disabled = true;
            btnText.textContent = "Hesaplanıyor...";
            btnSpinner.classList.remove('d-none');

            waitingState.style.display = 'none';
            resultSection.style.display = 'none';

            const requestPayload = {
                departmentId: parseInt(document.getElementById('departmentSelect').value),
                year: parseInt(document.getElementById('yearSelect').value),
                expectedInflation: parseFloat(document.getElementById('inflationInput').value),
                expectedUsdIncrease: parseFloat(document.getElementById('usdInput').value),
                expectedGoldIncrease: parseFloat(document.getElementById('goldInput').value)
            };

            try {
                // GERÇEK API BAĞLANTISI
                const response = await fetch('https://localhost:7169/api/Budget/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestPayload)
                });

                if (!response.ok) {
                    throw new Error("Sunucudan geçerli bir yanıt alınamadı.");
                }

                const data = await response.json();

                // UI'ı Gelen Verilerle Doldurma...

                document.getElementById('resDepartment').textContent = `${data.departmentName} - ${data.tahminYili} Bütçe Tahmini`;
                document.getElementById('resPrevious').textContent = formatter.format(data.oncekiYilHarcamasi);
                document.getElementById('resPredicted').textContent = formatter.format(data.tahminiButce);

                const changeEl = document.getElementById('resChange');
                changeEl.textContent = `%${data.yuzdeDegisim}`;
                changeEl.style.color = data.yuzdeDegisim > 0 ? '#198754' : '#dc3545';

                document.getElementById('resExplanation').textContent = data.aciklama;
                resultSection.style.display = 'block';

            } catch (error) {
                console.error("API Hatası:", error);
                alert("Hesaplama sırasında bir hata oluştu.");
                waitingState.style.display = 'flex';
            } finally {
                btn.disabled = false;
                btnText.textContent = "Simülasyonu Başlat";
                btnSpinner.classList.add('d-none');
            }
        });
    </script>

</body>
</html>
